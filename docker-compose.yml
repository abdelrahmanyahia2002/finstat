services:
  postgres:
    image: postgres:16-alpine
    container_name: finstat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finstat
      POSTGRES_PASSWORD: finstat
      POSTGRES_DB: finstat
    ports:
      - "5433:5432"
    volumes:
      - finstat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finstat -d finstat"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: finstat-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - finstat-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  finstat-pgdata:
  finstat-redisdata:
